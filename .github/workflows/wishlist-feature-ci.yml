name: Wishlist Feature CI/CD

on:
  push:
    branches:
      - feat/whishlist_related
  pull_request:
    branches:
      - feat/whishlist_related

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN
        
    - name: Build with Maven
      run: ./mvnw clean install -DskipTests -T 2C
      
    - name: Run tests
      run: ./mvnw test -T 2C
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/target/surefire-reports/*.xml'
    
    - name: Upload build artifacts (JARs)
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          **/target/*.jar
          !**/target/*-sources.jar
          !**/target/original-*.jar
    
    - name: Publish to GitHub Packages
      run: |
        echo "Deploying to GitHub Packages..."
        ./mvnw deploy -DskipTests -Dmaven.install.skip=true -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/the-skrishna/shopizer
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
